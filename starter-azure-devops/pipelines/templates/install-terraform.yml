parameters:
  - name: terraformVersion
    type: string

steps:
  - bash: |
      set -euo pipefail
      version="${{ parameters.terraformVersion }}"
      dest="$(Agent.ToolsDirectory)/terraform/${version}"
      base="https://releases.hashicorp.com/terraform/${version}"
      zip="terraform_${version}_linux_amd64.zip"
      mkdir -p "${dest}"
      cd "${dest}"
      curl -fsSL --retry 3 --retry-all-errors -o "${zip}" "${base}/${zip}"
      curl -fsSL --retry 3 --retry-all-errors -o SHA256SUMS "${base}/terraform_${version}_SHA256SUMS"
      grep " ${zip}\$" SHA256SUMS > expected.sha256
      sha256sum -c expected.sha256
      unzip -oq "${zip}"
      rm -f "${zip}" SHA256SUMS expected.sha256
      chmod +x terraform
      echo "##vso[task.prependpath]${dest}"
    displayName: Install Terraform ${{ parameters.terraformVersion }}

  - bash: terraform version
    displayName: Show Terraform version
