name: terraform

on:
  pull_request:
    paths: ["live/**", "modules/**", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["live/**", "modules/**"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_VERSION: 1.16.1
  AWS_REGION: eu-west-2

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - run: terraform fmt -check -recursive

  plan:
    name: plan ${{ matrix.brand }}/${{ matrix.environment }}
    needs: fmt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        brand: [brand-one, brand-two]
        environment: [dev, test, preprod, prod]
        include:
          - { brand: brand-one, brand_key: ONE }
          - { brand: brand-two, brand_key: TWO }
          - { environment: dev, env_key: DEV }
          - { environment: test, env_key: TEST }
          - { environment: preprod, env_key: PREPROD }
          - { environment: prod, env_key: PROD }
    env:
      TF_IN_AUTOMATION: "true"
      AUTHSIGNAL_API_SECRET: ${{ secrets[format('AUTHSIGNAL_API_SECRET_{0}_{1}', matrix.brand_key, matrix.env_key)] }}
    defaults:
      run:
        working-directory: live/${{ matrix.brand }}/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.TF_STATE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - run: terraform init -backend-config=backend.hcl
      - run: terraform validate
      - run: terraform plan -lock-timeout=5m -input=false -out=tfplan

      - uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.brand }}-${{ matrix.environment }}
          path: live/${{ matrix.brand }}/${{ matrix.environment }}/tfplan
          retention-days: 5

  apply-dev:
    if: github.event_name == 'push'
    needs: plan
    uses: ./.github/workflows/apply-environment.yml
    with:
      environment: dev
      env_key: DEV
    secrets: inherit

  apply-test:
    if: github.event_name == 'push'
    needs: apply-dev
    uses: ./.github/workflows/apply-environment.yml
    with:
      environment: test
      env_key: TEST
    secrets: inherit

  apply-preprod:
    if: github.event_name == 'push'
    needs: apply-test
    uses: ./.github/workflows/apply-environment.yml
    with:
      environment: preprod
      env_key: PREPROD
    secrets: inherit

  apply-prod:
    if: github.event_name == 'push'
    needs: apply-preprod
    uses: ./.github/workflows/apply-environment.yml
    with:
      environment: prod
      env_key: PROD
    secrets: inherit
